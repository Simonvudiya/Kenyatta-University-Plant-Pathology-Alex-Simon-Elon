version: "3.8"
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms_pass
      POSTGRES_DB: lms_db
    volumes:
      - lms_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./:/usr/src/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://lms:lms_pass@db:5432/lms_db
      - JWT_SECRET=replace_this
    depends_on:
      - db

volumes:
  lms_db_data:
